<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión &middot; Growth Horizon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ripple.css') }}">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>

<body class="h-full bg-slate-950 text-slate-200 antialiased">

    <div class="min-h-full grid place-items-center px-6 py-12">
        <div class="w-full max-w-md space-y-8">
            <div class="text-center space-y-2">
                <div
                    class="mx-auto w-12 h-12 rounded-xl bg-gradient-to-br from-cyan-400 to-emerald-500 flex items-center justify-center text-xl font-black text-slate-900">
                    GH</div>
                <h1 class="text-2xl font-bold text-white">Bienvenido a Growth Horizon</h1>
                <p class="text-sm text-slate-500">Inicia sesión para acceder a tu panel sectorizado.</p>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-5">
                {% with mensajes = get_flashed_messages(with_categories=true) %}
                {% for categoria, mensaje in mensajes %}
                <div class="px-4 py-3 rounded-lg text-sm font-medium border
                            {% if categoria == 'error' %}bg-red-500/10 text-red-300 border-red-800
                            {% elif categoria == 'success' %}bg-emerald-500/10 text-emerald-300 border-emerald-800
                            {% else %}bg-sky-500/10 text-sky-300 border-sky-800{% endif %}">
                    {{ mensaje }}
                </div>
                {% endfor %}
                {% endwith %}

                <form method="post" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium mb-1.5 text-slate-300">Correo electrónico</label>
                        <input type="email" name="email" required autofocus
                            class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-sm"
                            placeholder="nombre@empresa.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5 text-slate-300">Contraseña</label>
                        <input type="password" name="password" required
                            class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-sm"
                            placeholder="••••••••">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 text-sm text-slate-400">
                            <input type="checkbox" name="recordarme" class="rounded bg-slate-800 border-slate-700">
                            Recordarme
                        </label>
                        <a href="{{ url_for('auth.registro') }}" class="text-sm text-cyan-400 hover:text-cyan-300">Crear
                            cuenta</a>
                    </div>
                    <button type="submit"
                        class="w-full py-3 rounded-lg bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-900 font-semibold hover:opacity-90 transition">
                        Iniciar sesión
                    </button>
                </form>
            </div>

            <p class="text-center text-sm"><a href="{{ url_for('main.index') }}"
                    class="text-slate-500 hover:text-slate-300">&larr; Volver al inicio</a></p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='ripple.js') }}"></script>
</body>
